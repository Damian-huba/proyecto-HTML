<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Funcionarios - COMDEPRO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; background-color:#f4f7f6; font-family:sans-serif;">

    <div style="background:#fff; padding: 40px; border-radius:10px; box-shadow:0 4px 15px rgba(0,0,0,0.15); width: 340px;">
        <h2 style="color:#008282; text-align:center; margin-top:0; font-size:1.6rem;">Acceso Seguro 🔒</h2>
        <p style="text-align:center; color:#555; font-size:0.85rem; margin-top:-10px; margin-bottom:25px;">Consejo Municipal de Derechos de Niños, Niñas y Adolescentes</p>
        
        <form action="login.php" method="POST">
            <div style="margin-bottom:15px;">
                <label style="font-weight:bold; color:#333; font-size:0.9rem;">Usuario:</label>
                <input type="text" name="usuario" placeholder="Ingrese su usuario" required style="width:100%; padding:10px; margin-top:5px; box-sizing:border-box; border:1px solid #ccc; border-radius:5px; outline:none;">
            </div>

            <div style="margin-bottom:20px;">
                <label style="font-weight:bold; color:#333; font-size:0.9rem;">Contraseña:</label>
                <input type="password" name="password" placeholder="Ingrese su contraseña" required style="width:100%; padding:10px; margin-top:5px; box-sizing:border-box; border:1px solid #ccc; border-radius:5px; outline:none;">
            </div>

            <button type="submit" style="width:100%; background:#004D4D; color:#fff; border:none; padding:11px; border-radius:20px; cursor:pointer; font-weight:bold; font-size:1rem; transition: background 0.3s;" onmouseover="this.style.background='#008282'" onmouseout="this.style.background='#004D4D'">Ingresar</button>
        </form>

        <hr style="margin: 20px 0 15px 0; border: 0; border-top: 1px dashed #ccc;">

        <!-- Botón para retornar al portal público -->
        <a href="index.php" style="display:block; text-align:center; color:#004D4D; text-decoration:none; font-weight:bold; font-size:0.88rem; padding:8px; border:1px solid #004D4D; border-radius:20px; transition: all 0.3s;" onmouseover="this.style.background='#004D4D'; this.style.color='#fff'" onmouseout="this.style.background='transparent'; this.style.color='#004D4D'">
            🏠 Volver al Sitio Web Principal
        </a>
    </div>

</body>
</html>
